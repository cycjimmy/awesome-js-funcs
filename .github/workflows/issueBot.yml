name: Issue Bot

# Rule-based triage for issues: label/reply on newly opened issues, and
# release the needs-info label once the reporter comes back with details.
# All untrusted issue content is passed through environment variables (never
# interpolated into a shell command) so it cannot break out of the workflow.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write

# Serialize the per-issue handlers: label checks and replies are not atomic, so
# parallel edits or comments would answer the reporter twice.
concurrency:
  group: issue-triage-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage new issue
    runs-on: ubuntu-latest
    steps:
      - name: Apply triage rules
        uses: actions/github-script@v9
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          SENDER: ${{ github.event.sender.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const issueAuthor = process.env.ISSUE_AUTHOR || '';
            const commentAuthor = process.env.COMMENT_AUTHOR || '';
            const sender = process.env.SENDER || '';
            // Never react to bot activity to avoid loops
            if ([issueAuthor, commentAuthor, sender].some((login) => login.endsWith('[bot]'))) return;
            // `issue_comment` also fires for pull requests; only issues are triaged
            if (context.payload.issue?.pull_request) return;
            // Only getting back from the reporter counts as engagement: a
            // maintainer asking for a reproduction must not release the label
            const isReporter = sender === issueAuthor;

            const body = process.env.ISSUE_BODY || '';
            const title = (process.env.ISSUE_TITLE || '').toLowerCase();
            const lower = `${title}\n${body.toLowerCase()}`;
            const issueNumber = context.issue.number;
            const isCommentEvent = context.payload.comment != null;
            const isOpened = context.payload.action === 'opened' && !isCommentEvent;
            const isEdited = context.payload.action === 'edited' && !isCommentEvent;

            const labels = (names) => github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: names,
            }).catch((error) => {
              // A label missing from the repository is a configuration problem,
              // it must not take the whole triage run down with it
              if (error.status !== 422) throw error;
              core.warning(`Label missing from the repository: ${names.join(', ')}`);
            });

            const removeLabel = (name) => github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name,
            }).catch((error) => {
              // The label is already gone, nothing to do
              if (error.status !== 404) throw error;
            });

            const hasLabel = async (name) => {
              const { data } = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              return data.some((label) => label.name === name);
            };

            const reply = (message) => github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message,
            });

            // Drop only the scaffolding the issue forms generate: their own
            // "### <label>" headings and the "_No response_" placeholders.
            // Everything else - including headings, code references and code
            // comments written by the reporter - counts as information.
            const formHeading = /^###\s+(Describe the bug|Version|Environment|Steps to reproduce|Relevant code snippet or configuration|Expected behavior|Relevant log output|Additional context|Is your feature request related to a problem\?|Describe the solution you'd like|Describe alternatives you've considered)$/i;
            const userContent = body
              .split('\n')
              .map((line) => line.trim())
              .filter((line) => line && !formHeading.test(line) && !/^_no response_$/i.test(line))
              .join('\n');

            if (isOpened || isEdited) {
              // Rule 1: a module resolution / interop problem after the ESM switch.
              // The error signatures are quoted verbatim in reports, so the whole
              // text is searched; the ambiguous "cjs"/"commonjs" wording only counts
              // in the title, where it names the subject of the report instead of
              // showing up in a pasted config file name.
              const interopError = /err_require_esm|require\(\) of es module|cannot use import statement|e40[13]/;
              if (isOpened && (interopError.test(lower) || /\b(?:cjs|commonjs)\b/.test(title))) {
                await labels(['usage']);
                await reply(
                  'This looks like a module resolution problem.\n\n' +
                  'Since v5 the package is ESM only: `main`, `module` and `exports` ' +
                  'all point at `dist/`, and the old `/esm/*` and `/cjs/*` deep paths ' +
                  'are gone. Please check the migration table in the ' +
                  '[README](../blob/main/README.md#migrating-from-v4).\n\n' +
                  '- `import` works on every supported runtime\n' +
                  '- `require()` works on Node.js `^22.18.0` and `>=24.11.0` ' +
                  'through the built-in `require(esm)` support\n' +
                  '- older runtimes have to use `await import(...)`\n\n' +
                  'If that does not resolve it, please add the exact specifier you ' +
                  'import and the error message you get.'
                );
                return;
              }

              // Rule 2: low-information report (nearly every form field left empty).
              // This runs before the usage rule so a nearly blank report is sent back
              // for the missing details instead of being answered with a doc link.
              if (isOpened && userContent.length < 200) {
                await labels(['needs-info']);
                await reply(
                  'Thanks for opening this issue! Unfortunately, there is not enough ' +
                  'information to investigate it yet. Please edit the issue and add:\n\n' +
                  '- The version of the package you are using\n' +
                  '- The exact import statement that fails, or a minimal snippet ' +
                  'that reproduces the problem\n' +
                  '- The error message and the relevant part of your stack trace\n\n' +
                  'The issue will be closed automatically if there is no response within 7 days.'
                );
                return;
              }

              // Rule 3: a usage question. Judged on the title only: the body carries
              // the environment fields the issue form asks for (e.g. "Bundler:
              // Vite"), and matching those would label a real bug report as a usage
              // question.
              if (isOpened && /how (do|to|can i)|usage|use this (package|library)|tree.?shak/.test(title)) {
                await labels(['usage']);
                await reply(
                  'This looks like a usage question.\n\n' +
                  'The [README](../blob/main/README.md) documents the available ' +
                  'entry points and the v4 migration, and ' +
                  '[CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) covers the ' +
                  'development workflow.\n\n' +
                  'If that does not answer your question, let us know what you are ' +
                  'trying to achieve and what you have tried so far.'
                );
                return;
              }

              // The reporter came back with details on edit: release the issue from
              // the 7-day needs-info lifecycle managed by the stale workflow. A
              // title-only edit says nothing about the missing details.
              if (
                isEdited
                && isReporter
                && context.payload.changes?.body
                && (await hasLabel('needs-info'))
              ) {
                await removeLabel('needs-info');
                await reply(
                  'Thanks for the additional details! The `needs-info` label has ' +
                  'been removed, so this issue is back in the normal review queue.'
                );
              }
              return;
            }

            // Comment event: a reply from the reporter also counts as engagement
            if (isCommentEvent && isReporter && (await hasLabel('needs-info'))) {
              await removeLabel('needs-info');
              await reply(
                'Thanks for the reply! The `needs-info` label has been removed, so ' +
                'this issue is back in the normal review queue.'
              );
            }
