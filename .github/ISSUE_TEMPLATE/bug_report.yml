name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of @cycjimmy/awesome-js-funcs you are using.
      placeholder: 5.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, the package manager, and the bundler or browser if the problem shows up there.
      placeholder: |
        Node.js: 22
        npm: 10
        Bundler: Vite 8 (or "none" for plain Node.js)
        Browser: Chrome 130 (only if UI related)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact import statement plus the smallest snippet that shows the problem.
      placeholder: |
        1. import { isMobile } from '@cycjimmy/awesome-js-funcs'
        2. Call isMobile() on ...
        3. See error
      render: text
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant code snippet or configuration
      description: The call site, or a link to a minimal reproduction repository.
      render: text

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The error message and the relevant part of the stack trace, if available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
